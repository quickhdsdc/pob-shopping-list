<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoB 配装采购单生成器</title>
<style>
  :root{
    --bg:#e9eaee; --panel:#f5f6f8; --panel-2:#eceef2;
    --ink:#191c22; --muted:#5d6473; --faint:#868d9c; --line:#ccd1d9;
    --unique:#8d5117; --rare:#6f5f0c; --magic:#33409e; --normal:#4a4f5a;
    --modtext:#464f8c; --accent:#8d5117; --accent-ink:#fff;
    --ok:#2f6b46; --bad:#9c3025;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#13151a; --panel:#1a1d24; --panel-2:#20242c;
      --ink:#e3e6eb; --muted:#98a0af; --faint:#6f7787; --line:#2a2f39;
      --unique:#d08b4f; --rare:#ddd06a; --magic:#93a0ea; --normal:#b6bcc7;
      --modtext:#9aa4d6; --accent:#d08b4f; --accent-ink:#1a1206;
      --ok:#6cc08d; --bad:#e07a6c;
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); margin:0;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 20px 80px}
  header{border-bottom:1px solid var(--line); padding:22px 0 16px; margin-bottom:24px}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
     font-size:26px; margin:0 0 4px; font-weight:600}
  h1 small{display:block; font-size:12px; font-weight:400; letter-spacing:.14em;
     text-transform:uppercase; color:var(--faint); margin-top:6px; font-family:inherit}

  textarea{width:100%; min-height:96px; font-family:"Cascadia Mono",Consolas,monospace;
    font-size:12px; padding:10px; border:1px solid var(--line); border-radius:3px;
    background:var(--panel); color:var(--ink); resize:vertical}
  .ctl{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end; margin:14px 0}
  .f{display:flex; flex-direction:column; gap:4px}
  .f label{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
  input,select{font:inherit; font-size:14px; padding:6px 9px; background:var(--panel);
    color:var(--ink); border:1px solid var(--line); border-radius:2px}
  input[type=number]{width:78px}
  #league{width:150px}
  button{font:inherit; font-size:13px; font-weight:600; padding:8px 16px; cursor:pointer;
    border-radius:2px; background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent)}
  button:hover{filter:brightness(1.08)}
  button.sec{background:transparent; color:var(--muted); border-color:var(--line); font-weight:400}
  button.sec:hover{color:var(--ink); border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  #status{font-size:13px; color:var(--muted); margin:10px 0 0; min-height:20px}
  #status.err{color:var(--bad)}
  #status.ok{color:var(--ok)}

  .card{border:1px solid var(--line); border-radius:3px; background:var(--panel);
    padding:14px 16px; margin-bottom:12px}
  .chead{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap}
  .slot{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
  .iname{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:17px; font-weight:600; line-height:1.25}
  .U{color:var(--unique)} .R{color:var(--rare)} .M{color:var(--magic)} .N{color:var(--normal)}
  .ibase{font-size:13px; color:var(--muted)}
  .acts{display:flex; gap:6px; align-items:center; flex-shrink:0}

  table.mods{width:100%; border-collapse:collapse; margin-top:11px;
    font-family:"Cascadia Mono",Consolas,monospace; font-size:12px}
  table.mods td{padding:3px 6px 3px 0; vertical-align:middle; border-top:1px solid var(--line)}
  table.mods tr:first-child td{border-top:none}
  td.txt{color:var(--modtext); width:100%}
  td.txt.off{color:var(--faint); text-decoration:line-through}
  td.txt.nomatch{color:var(--bad); text-decoration:none}
  td.num input{width:66px; font-size:11.5px; padding:3px 5px; font-family:inherit}
  .badge{display:inline-block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid var(--line); color:var(--faint); padding:0 4px; border-radius:2px; margin-left:6px;
    font-family:"Segoe UI",sans-serif; vertical-align:1px}
  .hint{font-size:12px; color:var(--faint); margin:9px 0 0}
  details{margin-top:10px}
  summary{cursor:pointer; font-size:12px; color:var(--muted)}
  .empty{color:var(--faint); font-size:14px; padding:30px 0; text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>PoB 配装采购单生成器<small>粘贴 PoB 代码 → 每件装备一条交易站搜索</small></h1>
</header>

<textarea id="code" spellcheck="false" placeholder="粘贴 Path of Building 导出代码（PoB 里 Import/Export → Generate → 复制那串长字符）&#10;&#10;pobb.in / pob.cool 的链接不行 —— 浏览器跨域拿不到，请粘贴代码本身。"></textarea>

<div class="ctl">
  <div class="f"><label for="league">赛季</label><input id="league" value="Allflame" spellcheck="false"></div>
  <div class="f"><label for="st">挂单</label>
    <select id="st">
      <option value="securable" selected>一口价</option>
      <option value="available">一口价+当面</option>
      <option value="onlineleague">在线(本赛季)</option>
      <option value="online">在线(全部)</option>
      <option value="any">全部</option>
    </select></div>
  <div class="f"><label for="tol">容差 %</label><input id="tol" type="number" value="80" min="10" max="100" step="5"></div>
  <div class="f"><label for="maxmods">每件最多筛几条</label><input id="maxmods" type="number" value="4" min="1" max="8"></div>
  <div class="f"><label>&nbsp;</label><button id="go">生成</button></div>
  <div class="f"><label>&nbsp;</label><button id="copyall" class="sec">复制全部链接</button></div>
</div>
<p id="status"></p>

<div id="out"><p class="empty">粘贴代码后点「生成」</p></div>
</div>

<script id="lut" type="text/plain">__LUT__</script>
<script>
(function(){
'use strict';

/* ---------- 词条对照表：三级索引 ---------- */
const ENTRIES = [];                       // {text, hash}
const IDX_NORM = new Map();               // "#" 归一化 -> index
const IDX_RAW  = new Map();               // 原文 -> index
const IDX_KEY  = new Map();               // 抽掉数字的规范键 -> index
(function(){
  const norm = t => t.replace(/\d+(\.\d+)?/g,'#');
  const key  = t => t.toLowerCase().replace(/[0-9#.]+/g,'').replace(/[^a-z]/g,'');
  const raw = document.getElementById('lut').textContent;
  for(const line of raw.split('\n')){
    const i = line.indexOf('\t');
    if(i <= 0) continue;
    const text = line.slice(0,i), hash = line.slice(i+1);
    const idx = ENTRIES.push({text, hash}) - 1;
    if(!IDX_RAW.has(text))        IDX_RAW.set(text, idx);
    const n = norm(text);
    if(!IDX_NORM.has(n))          IDX_NORM.set(n, idx);
    const k = key(text);
    if(!IDX_KEY.has(k))           IDX_KEY.set(k, idx);
  }
})();

function stripTag(line){ return line.replace(/^\{[^}]*\}\s*/,'').trim(); }

/* 用命中的 LUT 文本反推正则，按位置精确取值 */
function extractValues(lutText, rawLine){
  const esc = lutText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const pat = '^' + esc.replace(/#/g, '([+-]?\\d+(?:\\.\\d+)?)') + '$';
  let m = null;
  try{ m = new RegExp(pat).exec(rawLine); }catch(e){}
  if(m) return m.slice(1).map(Number);
  const nums = (rawLine.match(/\d+(\.\d+)?/g)||[]).map(Number);
  return nums;
}

function matchMod(mod){
  const raw = stripTag(mod.line);
  const norm = raw.replace(/\d+(\.\d+)?/g,'#');
  const key  = raw.toLowerCase().replace(/[0-9#.]+/g,'').replace(/[^a-z]/g,'');
  let idx = IDX_NORM.get(norm);
  if(idx === undefined) idx = IDX_RAW.get(raw);
  if(idx === undefined) idx = IDX_KEY.get(key);
  // 单复数容错：Has 1 Abyssal Socket ↔ Has # Abyssal Sockets
  if(idx === undefined) idx = IDX_KEY.get(key + 's');
  if(idx === undefined && key.endsWith('s')) idx = IDX_KEY.get(key.slice(0,-1));
  if(idx === undefined) return {id:null, value:null};
  const e = ENTRIES[idx];
  const vals = extractValues(e.text, raw);
  let value = null;
  if(vals.length >= 2) value = (vals[0]+vals[1])/2;   // "Adds A to B" 取平均，交易站也是这么算
  else if(vals.length === 1) value = vals[0];
  return {id:(mod.implicit?'implicit':'explicit')+'.stat_'+e.hash, value};
}

/* ---------- PoB 代码解码 ---------- */
async function decodePob(code){
  code = code.trim().replace(/\s+/g,'');
  if(/^https?:\/\//i.test(code)) throw new Error('请粘贴代码本身，不是链接（浏览器跨域读不到 pobb.in）');
  const b64 = code.replace(/-/g,'+').replace(/_/g,'/');
  let bin;
  try { bin = atob(b64); } catch(e){ throw new Error('不是合法的 base64，检查有没有复制全'); }
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  if(typeof DecompressionStream === 'undefined') throw new Error('浏览器太旧，不支持 DecompressionStream');
  let buf;
  try{
    const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    buf = await new Response(s).arrayBuffer();
  }catch(e){ throw new Error('解压失败，可能不是 PoB 代码'); }
  return new TextDecoder('utf-8').decode(buf);
}

/* ---------- 物品文本解析 ---------- */
const SKIP = /^(Unique ID|Item Level|Quality|Sockets|LevelReq|Implicits|Armour|Evasion|Energy Shield|Ward|Intangibility|Catalyst|CatalystQuality|Radius|Limited to|Requires|Cluster Jewel|Talisman Tier|Prefix|Suffix|Note|Selected Variant|Variant|League|Source|Has \d+ Socket|.*BasePercentile)\s*:/i;
const FLAGS = /^(Corrupted|Mirrored|Split|Unidentified|Shaper Item|Elder Item|Warlord Item|Hunter Item|Redeemer Item|Crusader Item|Searing Exarch Item|Eater of Worlds Item|Fractured Item|Synthesised Item|Historic|Primordial|Foil Unique.*|Veiled.*)$/i;

function parseItem(text){
  const lines = text.split('\n').map(s=>s.trim()).filter(s=>s.length);
  if(!lines.length) return null;
  const rm = lines[0].match(/^Rarity:\s*(\w+)/i);
  if(!rm) return null;
  const rarity = rm[1].toUpperCase();
  const twoLine = (rarity==='RARE'||rarity==='UNIQUE'||rarity==='RELIC');
  const name = lines[1] || '';
  const base = twoLine ? (lines[2] || '') : name;
  let idx = twoLine ? 3 : 2;

  let implicitCount = 0, implicitAt = -1;
  for(let i=idx;i<lines.length;i++){
    const m = lines[i].match(/^Implicits:\s*(\d+)/i);
    if(m){ implicitCount = parseInt(m[1],10); implicitAt = i; break; }
  }
  const mods = [];
  if(implicitAt >= 0){
    for(let i=implicitAt+1;i<lines.length;i++){
      const L = lines[i];
      if(SKIP.test(L) || FLAGS.test(L)) continue;
      mods.push({ line:L, implicit: (i - implicitAt) <= implicitCount });
    }
  }
  return {rarity, name, base, mods};
}


/* ---------- 搜索 URL ---------- */
function tradeUrl(q){
  const lg = (document.getElementById('league').value||'Standard').trim()||'Standard';
  return 'https://www.pathofexile.com/trade/search/'+encodeURIComponent(lg)+
         '?q='+encodeURIComponent(JSON.stringify(q));
}
function buildQuery(card){
  const st = document.getElementById('st').value;
  const filters = [];
  card.rows.forEach(r=>{
    if(!r.on || !r.id) return;
    const e = {id:r.id, disabled:false};
    const v = parseFloat(r.input.value);
    if(!isNaN(v)) e.value = {min:v};
    filters.push(e);
  });
  const query = {status:{option:st}, stats:[{type:'and', filters}]};
  if(card.rarity==='UNIQUE'||card.rarity==='RELIC'){
    query.name = card.name;
    query.type = card.base;
  } else {
    query.type = card.base;
    query.filters = {type_filters:{filters:{rarity:{option: card.rarity==='MAGIC'?'magic':'nonunique'}}}};
  }
  return {query, sort:{price:'asc'}};
}

/* ---------- 渲染 ---------- */
const out = document.getElementById('out');
const statusEl = document.getElementById('status');
let CARDS = [];

function say(msg, cls){ statusEl.textContent = msg; statusEl.className = cls||''; }

function render(items){
  out.textContent = '';
  CARDS = [];
  const tol = (parseFloat(document.getElementById('tol').value)||80)/100;
  const maxMods = parseInt(document.getElementById('maxmods').value,10)||4;

  items.forEach(it=>{
    const card = document.createElement('div'); card.className='card';
    const head = document.createElement('div'); head.className='chead';
    const left = document.createElement('div');
    const sl = document.createElement('div'); sl.className='slot'; sl.textContent = it.slot||'—'; left.appendChild(sl);
    const nm = document.createElement('div'); nm.className='iname '+it.rarity[0]; nm.textContent = it.name; left.appendChild(nm);
    if(it.base && it.base!==it.name){ const bs=document.createElement('div'); bs.className='ibase'; bs.textContent=it.base; left.appendChild(bs); }
    head.appendChild(left);

    const acts = document.createElement('div'); acts.className='acts';
    const go = document.createElement('button'); go.textContent='官网搜索';
    const cp = document.createElement('button'); cp.className='sec'; cp.textContent='复制';
    acts.appendChild(go); acts.appendChild(cp); head.appendChild(acts);
    card.appendChild(head);

    const rec = {rarity:it.rarity, name:it.name, base:it.base, rows:[]};
    const isUniq = (it.rarity==='UNIQUE'||it.rarity==='RELIC');

    const tbl = document.createElement('table'); tbl.className='mods';
    let matched = 0;
    it.mods.forEach(m=>{
      const info = matchMod(m);
      const tr = document.createElement('tr');
      const tdC = document.createElement('td'); tdC.className='num';
      const cb = document.createElement('input'); cb.type='checkbox';
      // 传奇默认全不勾（靠名字搜即可）；稀有默认勾前 N 条能匹配的
      cb.checked = !!info.id && !isUniq && matched < maxMods;
      if(cb.checked) matched++;
      cb.disabled = !info.id;
      tdC.appendChild(cb); tr.appendChild(tdC);

      const tdT = document.createElement('td'); tdT.className='txt';
      tdT.textContent = m.line.replace(/^\{[^}]*\}\s*/,'');
      if(m.implicit){ const b=document.createElement('span'); b.className='badge'; b.textContent='植入'; tdT.appendChild(b); }
      if(!info.id){ tdT.classList.add('nomatch'); const b=document.createElement('span'); b.className='badge'; b.textContent='未识别'; tdT.appendChild(b); }
      tr.appendChild(tdT);

      const tdN = document.createElement('td'); tdN.className='num';
      const inp = document.createElement('input'); inp.type='number'; inp.step='1';
      if(info.value !== null) inp.value = Math.max(0, Math.floor(info.value*tol));
      inp.disabled = !info.id;
      tdN.appendChild(inp); tr.appendChild(tdN);

      tbl.appendChild(tr);
      const row = {on:cb.checked, id:info.id, input:inp};
      cb.addEventListener('change',()=>{ row.on = cb.checked; tdT.classList.toggle('off', !cb.checked && !!info.id); });
      rec.rows.push(row);
    });
    if(it.mods.length) card.appendChild(tbl);

    const hint = document.createElement('p'); hint.className='hint';
    hint.textContent = isUniq
      ? '传奇按名字+底子精确搜索，词条默认不勾（勾上可再筛数值范围）'
      : '默认勾选前 '+maxMods+' 条，数值已按容差自动填。勾选和数值都可以改。';
    card.appendChild(hint);

    go.addEventListener('click',()=>window.open(tradeUrl(buildQuery(rec)),'_blank','noopener'));
    cp.addEventListener('click',async()=>{
      try{ await navigator.clipboard.writeText(tradeUrl(buildQuery(rec)));
           cp.textContent='已复制'; setTimeout(()=>cp.textContent='复制',1500); }
      catch(e){ cp.textContent='失败'; setTimeout(()=>cp.textContent='复制',1500); }
    });

    rec.node = card;
    CARDS.push(rec);
    out.appendChild(card);
  });
}

/* ---------- 主流程 ---------- */
async function run(){
  const code = document.getElementById('code').value;
  if(!code.trim()){ say('先粘贴 PoB 代码','err'); return; }
  say('解码中…');
  let xml;
  try{ xml = await decodePob(code); }
  catch(e){ say(e.message,'err'); return; }

  let doc;
  try{ doc = new DOMParser().parseFromString(xml,'application/xml'); }
  catch(e){ say('XML 解析失败','err'); return; }
  if(doc.querySelector('parsererror')){ say('XML 解析失败','err'); return; }

  // itemId -> 槽位名
  const slotOf = {};
  doc.querySelectorAll('ItemSet Slot').forEach(s=>{
    const id = s.getAttribute('itemId');
    if(id && id!=='0') slotOf[id] = s.getAttribute('name');
  });
  doc.querySelectorAll('Sockets Socket').forEach(s=>{
    const id = s.getAttribute('itemId');
    if(id && id!=='0' && !slotOf[id]) slotOf[id] = '天赋树珠宝 '+s.getAttribute('nodeId');
  });

  const items = [];
  doc.querySelectorAll('Items > Item').forEach(node=>{
    const parsed = parseItem(node.textContent||'');
    if(!parsed) return;
    parsed.slot = slotOf[node.getAttribute('id')] || '（未装备）';
    items.push(parsed);
  });

  if(!items.length){ say('没解析到任何装备','err'); return; }

  // 已装备的排前面
  const ORDER = ['Weapon 1','Weapon 2','Helmet','Body Armour','Gloves','Boots','Amulet','Ring 1','Ring 2','Belt',
                 'Flask 1','Flask 2','Flask 3','Flask 4','Flask 5','Weapon 1 Swap','Weapon 2 Swap'];
  const rank = s => {
    const i = ORDER.indexOf(s);
    if(i >= 0) return i;
    if(s === '（未装备）') return 900;
    if(/Abyssal Socket/.test(s)) return 500;   // 装备上的深渊插槽
    return 700;                                 // 天赋树珠宝
  };
  items.sort((a,b)=>rank(a.slot)-rank(b.slot));
  render(items);

  // 传奇靠名字+底子搜，词条识别与否无所谓，只统计稀有/魔法上的
  const isUniq = it => (it.rarity==='UNIQUE'||it.rarity==='RELIC');
  const unmatched = items.reduce((n,it)=>isUniq(it)?n:n+it.mods.filter(m=>!matchMod(m).id).length,0);
  const nonUniqMods = items.reduce((n,it)=>isUniq(it)?n:n+it.mods.length,0);
  const total = items.reduce((n,it)=>n+it.mods.length,0);
  say('解析出 '+items.length+' 件装备，共 '+total+' 条词条。稀有/魔法装备 '+nonUniqMods+
      ' 条里有 '+unmatched+' 条未识别（红色标出，需手动处理）；传奇按名字搜，词条不影响。','ok');
}

document.getElementById('go').addEventListener('click',run);
document.getElementById('copyall').addEventListener('click',async()=>{
  if(!CARDS.length){ say('还没生成','err'); return; }
  const txt = CARDS.map(c=>'### '+c.name+(c.base&&c.base!==c.name?' | '+c.base:'')+'\n'+tradeUrl(buildQuery(c))).join('\n\n');
  try{ await navigator.clipboard.writeText(txt); say('已复制 '+CARDS.length+' 条链接','ok'); }
  catch(e){ say('复制失败','err'); }
});
window.__run = run;   // 供无头测试调用
})();
</script>
</body>
</html>
